services:
  db:
    image: postgres:latest
    container_name: postgres-dev
    restart: unless-stopped

    environment:
      POSTGRES_USER: hamza
      POSTGRES_PASSWORD: Ham@za
      POSTGRES_DB: devdb

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
